name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "assets/rendercv/cv.yaml"
      - "assets/rendercv/settings.yaml"
      - "requirements.txt"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          rendercv render assets/rendercv/cv.yaml --settings assets/rendercv/settings.yaml
          rm -f assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "CV PDF already up to date; nothing to commit."
          else
            git commit -m "chore: render the latest CV"
            git push
          fi
