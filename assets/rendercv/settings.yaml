# rendercv settings. Paths are relative to assets/rendercv/cv.yaml.
# Design/locale come from cv.yaml's embedded `design:` block (theme: moderncv).
settings:
  render_command:
    typst_path: ./rendercv_output/cv.typ
    pdf_path: ../pdf/Qingchuan_Tony_Yang_CV.pdf
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
